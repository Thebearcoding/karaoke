<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111312">
  <title>余音 · 今晚唱点什么</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 5-6 5H2v4h3l6 5zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="/" aria-label="余音首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><strong>余音</strong></a>
    <nav class="navigation" aria-label="主要导航">
      <button data-view="library" class="selected">点歌台</button>
      <button data-view="player">正在播放 <span id="playing-dot" hidden></span></button>
      <button data-view="queue" class="mobile-only">已点 <span id="nav-count">0</span></button>
    </nav>
    <div class="connection"><span id="connection-dot"></span><span id="connection-text">连接中</span></div>
  </header>

  <main class="workspace">
    <section class="main-panel" id="library-view" aria-label="点歌台">
      <div class="intro"><h1>今晚，唱点什么<span>。</span></h1></div>
      <form id="add-form" class="search-form">
        <div class="search-box"><svg class="icon"><use href="#i-search"/></svg><input id="song-input" type="text" autocomplete="off" maxlength="2048" enterkeyhint="search" aria-label="搜索歌名、歌手或粘贴视频链接" placeholder="搜歌名，或找一位喜欢的歌手"><button class="primary" id="submit-song" type="submit">搜索 <svg class="icon"><use href="#i-arrow"/></svg></button></div>
        <label class="optional-title" id="title-row" hidden>歌名 <input id="title-input" maxlength="200" placeholder="可选"></label>
      </form>
      <section id="video-results" class="video-results" aria-label="选歌结果" hidden>
        <div class="section-heading search-heading"><div><h2 id="search-heading">搜索结果</h2><div id="search-status" class="search-status" role="status"></div></div><button class="text-button" id="clear-search">返回曲库</button></div>
        <div class="search-controls">
          <div class="filters video-sources" role="group" aria-label="搜索类型"><button data-video-source="songs" class="selected">全部</button><button data-video-source="artists">歌手</button><button data-video-source="youtube">YouTube 视频</button><button data-video-source="local">本地</button></div>
          <label id="search-order-label">排序 <select id="search-order" aria-label="搜索结果排序"><option value="relevance">默认</option><option value="popular">播放量</option><option value="ready">已准备优先</option><option value="title">歌名</option></select></label>
        </div>
        <div id="artist-summary" class="artist-summary" hidden></div>
        <p id="search-order-note" class="search-order-note"></p>
        <div id="search-list">
          <div id="music-columns" class="music-columns" role="row" hidden><span class="music-rank" role="columnheader">#</span><span id="music-title-heading" class="music-song" role="columnheader">歌曲</span><span id="music-artist-heading" class="music-credits" role="columnheader">歌手</span><span class="music-album" role="columnheader">专辑</span><span class="music-plays" role="columnheader">播放量</span><span class="music-duration" role="columnheader">时长</span><span class="music-actions" role="columnheader">点歌</span><span id="music-alternative-heading" class="music-alternative" role="columnheader">找 MV</span></div>
          <div id="video-grid"></div>
        </div>
        <div id="search-more" class="search-more" hidden><p id="search-more-status" role="status"></p><button id="search-more-button" class="text-button" hidden>加载更多</button></div>
      </section>
      <section id="local-library">
      <div class="section-heading"><h2 id="library-heading">曲库</h2><span id="library-count"></span></div>
      <div class="filters" role="group" aria-label="筛选歌曲"><button data-filter="all" class="selected">全部</button><button data-filter="ready">已准备</button><button data-filter="Chinese">华语</button><button data-filter="English">英语</button><button data-filter="Japanese">日语</button><button data-filter="Korean">韩语</button><button data-filter="other">小语种</button></div>
      <div class="song-grid" id="song-grid" aria-live="polite"></div>
      <div class="search-empty" id="search-empty" hidden><h3>还没有歌曲</h3></div>
      </section>
    </section>

    <section class="main-panel player-panel" id="player-view" hidden aria-label="播放器">
      <div class="section-heading player-heading"><div><h1 id="player-title">未播放</h1><div class="song-info-row"><p><span id="player-artist"></span> <span class="quality-note" id="quality-note" hidden>歌词待校对</span></p><span id="player-elapsed"></span></div></div><button class="icon-button" id="fullscreen" aria-label="全屏播放" title="全屏 · F"><svg class="icon"><use href="#i-full"/></svg></button></div>
      <div class="player-stage" id="player-stage">
      <div class="screen" id="screen">
        <video id="video" playsinline muted preload="auto" aria-label="卡拉 OK 字幕 MV"></video>
        <div class="screen-cover" id="screen-cover"><div class="record-art"><div class="record-label"><span class="brand-mark"><i></i><i></i><i></i><i></i></span></div></div><p id="screen-status">请先点歌</p><div id="screen-preparation"></div><button class="primary" id="screen-start" hidden>开始唱 <svg class="icon"><use href="#i-play"/></svg></button></div>
        <div class="pitch-control" role="group" aria-label="升降调"><button id="pitch-down" aria-label="降半音" title="降半音">♭</button><button id="pitch-reset" aria-label="恢复原调" title="恢复原调"><span id="pitch-value">原调</span></button><button id="pitch-up" aria-label="升半音" title="升半音">♯</button></div>
        <button class="screen-next next-button" data-next title="下一首 · N">下一首 <svg class="icon"><use href="#i-next"/></svg></button>
        <button class="screen-exit icon-button" id="exit-fullscreen" aria-label="退出全屏"><svg class="icon"><use href="#i-full"/></svg></button>
      </div>
      <div id="fullscreen-progress" class="fullscreen-progress"></div>
      <div class="player-options"><div><div class="mix-switch" role="group" aria-label="人声模式"><button data-mix="instrumental">纯伴奏</button><button data-mix="karaoke" class="selected">保留伴唱</button><button data-mix="original">原唱</button></div></div><button id="restart" class="text-button"><svg class="icon"><use href="#i-restart"/></svg>重唱这首</button></div>
      <div class="stem-mixer" role="group" aria-label="分别调节音轨音量">
        <label class="stem-control" for="level-instrumental"><span>伴奏</span><output id="value-instrumental" for="level-instrumental">100%</output><input id="level-instrumental" data-level="instrumental" type="range" min="0" max="1" step="0.01" value="1" aria-label="伴奏音量"></label>
        <label class="stem-control" for="level-backing_vocals"><span>伴唱</span><output id="value-backing_vocals" for="level-backing_vocals">100%</output><input id="level-backing_vocals" data-level="backing_vocals" type="range" min="0" max="1" step="0.01" value="1" aria-label="伴唱音量"></label>
        <label class="stem-control" for="level-lead_vocals"><span>主唱</span><output id="value-lead_vocals" for="level-lead_vocals">0%</output><input id="level-lead_vocals" data-level="lead_vocals" type="range" min="0" max="1" step="0.01" value="0" aria-label="主唱音量"></label>
      </div>
      </div>
    </section>

    <aside class="queue-panel" id="queue-panel" aria-label="已点歌单">
      <div class="queue-header"><h2>已点 <span id="queue-count">00</span></h2><span class="queue-badge" id="queue-badge" hidden></span></div>
      <div id="queue-list" class="queue-list"></div>
      <div id="queue-empty" class="queue-empty"><div class="queue-empty-lines"><i></i><i></i><i></i></div><h3>还没点歌</h3></div>
      <div class="queue-foot"><a id="remote-link" href="/?remote=1" target="_blank" rel="noopener">遥控点歌 ↗</a></div>
      <details class="storage-panel">
        <summary><span>本地缓存</span><span id="storage-usage">正在读取</span></summary>
        <progress id="storage-meter" max="1" value="0" aria-label="歌曲缓存使用量"></progress>
        <p id="storage-note" class="storage-warning" hidden>空间不足，请移除待唱歌曲或提高上限。</p>
        <form id="storage-form"><label for="storage-limit">容量上限</label><input id="storage-limit" type="number" min="1" max="4096" step="1" value="10" required><span>GiB</span><button type="submit" id="storage-save">保存</button></form>
      </details>
    </aside>
  </main>

  <footer class="transport">
    <button class="now-song" id="now-song" aria-label="查看正在播放"><div class="now-art" id="now-art"><span>♪</span></div><div><strong id="now-title">未播放</strong><span id="now-artist"></span></div></button>
    <div class="transport-center"><div class="transport-buttons"><button class="icon-button" id="transport-restart" aria-label="重唱" title="重唱"><svg class="icon"><use href="#i-restart"/></svg></button><button class="play-button" id="play-toggle" aria-label="播放"><svg class="icon"><use id="play-icon" href="#i-play"/></svg></button><button class="next-button" id="next-song" data-next title="下一首 · N">下一首 <svg class="icon"><use href="#i-next"/></svg></button></div><div class="seek-row"><time id="current-time">0:00</time><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放进度"><time id="duration">0:00</time></div></div>
    <div class="volume-control"><button id="mute" class="icon-button" aria-label="静音"><svg class="icon"><use href="#i-volume"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量"><span id="volume-value">80</span></div>
  </footer>
  <dialog id="video-preview" class="video-preview" aria-labelledby="preview-title">
    <div class="preview-heading"><h2 id="preview-title"></h2><button id="close-preview" aria-label="关闭预览">×</button></div>
    <div id="preview-player" class="preview-player"></div>
    <div class="preview-actions"><a id="preview-source" target="_blank" rel="noopener noreferrer"></a><button id="preview-add" class="primary">点歌</button></div>
    <p id="preview-error" role="status" hidden></p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
