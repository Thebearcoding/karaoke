<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#202022">
  <title>退学 KTV · 今晚唱点什么</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script src="/assets/theme.js"></script>
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m9 5 11 7-11 7z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m5 5 10 7-10 7zM19 5v14"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 13.5A8.5 8.5 0 0 1 10.5 3.5a8.5 8.5 0 1 0 10 10Z"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
  </svg>

  <header class="topbar">
    <a class="brand" href="/" aria-label="退学 KTV 首页"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span class="brand-wordmark"><span class="brand-name">退学</span><span class="brand-type">KTV</span></span></a>
    <nav class="navigation" aria-label="主要导航">
      <button data-view="library" class="selected">点歌台</button>
      <button data-view="player">正在播放 <span id="playing-dot" hidden></span></button>
      <button data-view="queue" class="mobile-only">待唱 <span id="nav-count">0</span></button>
    </nav>
    <button id="theme-toggle" class="theme-toggle" aria-label="切换到日间模式" title="切换到日间模式"><svg class="icon theme-moon" aria-hidden="true"><use href="#i-moon"/></svg><svg class="icon theme-sun" aria-hidden="true"><use href="#i-sun"/></svg></button>
    <div class="connection"><span id="connection-dot"></span><span id="connection-text">连接中</span></div>
  </header>

  <main class="workspace">
    <section class="main-panel" id="library-view" aria-label="点歌台">
      <form id="add-form" class="search-form" role="search">
        <div class="search-box"><svg class="icon"><use href="#i-search"/></svg><input id="song-input" type="text" autocomplete="off" maxlength="2048" enterkeyhint="search" aria-label="搜索歌名、歌手或粘贴视频链接" placeholder="搜索歌名或歌手"><button id="submit-song" type="submit">搜索 <svg class="icon"><use href="#i-arrow"/></svg></button></div>
        <label class="optional-title" id="title-row" hidden>歌名 <input id="title-input" maxlength="200" placeholder="可选"></label>
      </form>
      <section id="home-discovery" class="home-discovery" aria-label="按歌手选歌" hidden>
        <div class="section-heading"><h2>歌手</h2><button id="more-artists" class="text-button">更多 <svg class="icon" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>
        <div id="home-artists" class="home-artists"></div>
      </section>
      <section id="local-library">
      <div class="section-heading library-heading"><h1 id="library-heading">本地曲库</h1><span id="library-count"></span>
        <nav class="pagination library-pagination" aria-label="本地曲库分页" hidden>
          <button data-library-step="-1" aria-label="上一页" title="上一页"><svg class="icon"><use href="#i-up"/></svg></button>
          <select aria-label="本地曲库页码"></select>
          <button data-library-step="1" aria-label="下一页" title="下一页"><svg class="icon"><use href="#i-up"/></svg></button>
        </nav>
      </div>
      <div class="filters library-filters" role="group" aria-label="筛选歌曲"><button data-filter="all" class="selected">全部 <span>0</span></button><button data-filter="Chinese">华语 <span>0</span></button><button data-filter="Cantonese">粤语 <span>0</span></button><button data-filter="English">英语 <span>0</span></button><button data-filter="Japanese">日语 <span>0</span></button><button data-filter="Korean">韩语 <span>0</span></button><button data-filter="other">小语种 <span>0</span></button></div>
      <div class="search-list home-list" id="library-list" role="table" aria-label="本地歌曲列表">
        <div class="music-columns" role="row"><span class="music-rank" role="columnheader">#</span><span class="music-song" role="columnheader">歌曲</span><span class="music-credits" role="columnheader">歌手</span><span class="music-album" role="columnheader">专辑</span><span class="music-plays" role="columnheader">播放量</span><span class="music-duration" role="columnheader">时长</span><span class="music-actions" role="columnheader">点歌</span><span class="music-alternative" role="columnheader">找 MV</span></div>
        <div class="music-list" id="song-grid" role="rowgroup"></div>
      </div>
      <nav class="pagination library-pagination library-pagination-bottom" aria-label="本地曲库底部分页" hidden>
        <button data-library-step="-1" aria-label="上一页" title="上一页"><svg class="icon"><use href="#i-up"/></svg></button>
        <select aria-label="本地曲库页码"></select>
        <button data-library-step="1" aria-label="下一页" title="下一页"><svg class="icon"><use href="#i-up"/></svg></button>
      </nav>
      <div class="search-empty" id="search-empty" hidden><h3>还没有歌曲</h3><p>搜一首喜欢的歌，开始唱。</p></div>
      </section>
      <section id="video-results" class="video-results" aria-label="选歌结果" hidden>
        <div class="section-heading search-heading"><div><h2 id="search-heading">搜索结果</h2><div id="search-status" class="search-status" role="status"></div></div><button class="text-button" id="clear-search">返回本地曲库</button></div>
        <div class="search-controls">
          <div class="search-modes"><div class="filters video-sources" role="group" aria-label="搜索内容"><button data-video-source="songs" class="selected">综合</button><button data-video-source="artists">歌手</button></div><div class="search-sources" role="group" aria-label="其他搜索来源"><button data-video-source="youtube">YouTube 视频</button><button data-video-source="local">本地曲库</button></div></div>
          <label id="search-order-label"><select id="search-order" aria-label="搜索结果排序"><option value="relevance">默认排序</option><option value="popular">按播放量</option><option value="lyrics">有歌词优先</option><option value="ready">可直接唱优先</option><option value="title">按歌名</option></select></label>
        </div>
        <div id="artist-summary" class="artist-summary" hidden></div>
        <p id="search-order-note" class="search-order-note"></p>
        <div id="search-list">
          <div id="music-columns" class="music-columns" role="row" hidden><span class="music-rank" role="columnheader">#</span><span id="music-title-heading" class="music-song" role="columnheader">歌曲</span><span id="music-artist-heading" class="music-credits" role="columnheader">歌手</span><span class="music-album" role="columnheader">专辑</span><span class="music-plays" role="columnheader">播放量</span><span class="music-duration" role="columnheader">时长</span><span class="music-actions" role="columnheader">点歌</span><span id="music-alternative-heading" class="music-alternative" role="columnheader">找 MV</span></div>
          <div id="video-grid"></div>
        </div>
        <div id="search-more" class="search-more" hidden><p id="search-more-status" role="status"></p><button id="search-more-button" class="text-button" hidden>加载更多</button></div>
      </section>

    </section>

    <section class="main-panel player-panel" id="player-view" hidden aria-label="播放器">
      <div class="section-heading player-heading"><div><h1 id="player-title">未播放</h1><div class="song-info-row"><p id="player-artist"></p><span id="player-elapsed"></span></div></div><button class="icon-button" id="fullscreen" aria-label="全屏播放" title="全屏 · F"><svg class="icon"><use href="#i-full"/></svg></button></div>
      <div class="player-stage" id="player-stage">
      <div class="screen" id="screen">
        <video id="video" playsinline muted preload="none" aria-label="卡拉 OK 字幕 MV"></video>
        <svg id="opening-countdown" class="opening-countdown" aria-label="准备开唱" hidden></svg>
        <button id="skip-intro" class="skip-intro" hidden>跳过前奏 <svg class="icon" aria-hidden="true"><use href="#i-next"/></svg></button>
        <div class="screen-cover" id="screen-cover"><p id="screen-status">请先点歌</p><div id="screen-preparation"></div><button class="primary" id="screen-start" hidden>开始唱 <svg class="icon"><use href="#i-play"/></svg></button><button class="primary" id="screen-retry" hidden>重试</button></div>
        <button class="screen-exit icon-button" id="exit-fullscreen" aria-label="退出全屏"><svg class="icon"><use href="#i-full"/></svg></button>
      </div>
      </div>
    </section>

    <aside class="queue-panel" id="queue-panel" aria-label="已点歌单">
      <div class="queue-header"><div class="queue-tabs" role="tablist" aria-label="待唱与已唱">
        <button id="upcoming-tab" data-queue-tab="upcoming" role="tab" aria-selected="true" aria-controls="upcoming-panel">待唱 <span id="queue-count">00</span></button>
        <button id="history-tab" data-queue-tab="history" role="tab" aria-selected="false" aria-controls="history-panel" tabindex="-1">已唱 <span id="history-count">00</span></button>
      </div></div>
      <section id="upcoming-panel" class="queue-content" role="tabpanel" aria-labelledby="upcoming-tab">
        <span class="queue-badge" id="queue-badge" hidden></span>
        <nav class="pagination queue-pagination" id="queue-pagination" aria-label="待唱分页" hidden><button data-page-step="-1" aria-label="待唱上一页"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg></button><select aria-label="待唱页码"></select><button data-page-step="1" aria-label="待唱下一页"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg></button></nav>
        <div id="queue-list" class="queue-list"></div>
        <div id="queue-empty" class="queue-empty"><div class="queue-empty-lines"><i></i><i></i><i></i></div><h3>还没点歌</h3></div>
      </section>
      <section id="history-panel" class="queue-content" role="tabpanel" aria-labelledby="history-tab" hidden>
        <label class="history-search"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><input id="history-query" type="search" placeholder="搜索已唱的歌名或歌手" aria-label="搜索已唱的歌名或歌手" autocomplete="off"></label>
        <nav class="pagination queue-pagination" id="history-pagination" aria-label="已唱分页" hidden><button data-page-step="-1" aria-label="已唱上一页"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg></button><select aria-label="已唱页码"></select><button data-page-step="1" aria-label="已唱下一页"><svg class="icon" aria-hidden="true"><use href="#i-up"/></svg></button></nav>
        <div id="history-list" class="queue-list"></div>
        <div id="history-empty" class="queue-empty"><div class="queue-empty-lines"><i></i><i></i><i></i></div><h3>还没有唱过的歌</h3></div>
      </section>
      <details class="storage-panel">
        <summary><span>本地缓存</span><span id="storage-usage">正在读取</span></summary>
        <progress id="storage-meter" max="1" value="0" aria-label="歌曲缓存使用量"></progress>
        <p id="storage-note" class="storage-warning" hidden>空间不足，请移除待唱歌曲或提高上限。</p>
        <form id="storage-form"><label for="storage-limit">容量上限</label><input id="storage-limit" type="number" min="1" max="4096" step="1" value="10" required><span>GiB</span><button type="submit" id="storage-save">保存</button></form>
      </details>
    </aside>
  </main>

  <footer class="transport">
    <div class="transport-layout">
      <div class="transport-track">
        <button class="now-song" id="now-song" aria-label="查看正在播放"><div class="now-art" id="now-art"><span>♪</span></div><div><strong id="now-title">未播放</strong><span id="now-artist"></span></div></button>
      </div>
      <div class="transport-center"><div class="transport-playback"><div class="transport-buttons"><button class="next-button" id="transport-restart" aria-label="重唱" title="重唱"><svg class="icon"><use href="#i-restart"/></svg>重唱</button><button class="play-button" id="play-toggle" aria-label="播放"><svg class="icon"><use id="play-icon" href="#i-play"/></svg></button><button class="next-button" id="next-song" data-next title="下一首 · N">下一首 <svg class="icon"><use href="#i-next"/></svg></button></div></div><div class="seek-row"><time id="current-time">0:00</time><input id="seek" type="range" min="0" max="1" step="0.1" value="0" aria-label="播放进度"><time id="duration">0:00</time></div></div>
      <div class="transport-sound">
        <div class="transport-tools" id="transport-tools">
          <div class="lead-control" role="group" aria-label="主唱音量"><button id="lead-toggle" class="lead-toggle" aria-label="主唱开关" aria-pressed="false">主唱：关</button><button id="lead-down" aria-label="主唱减小 5%" title="主唱减小 5%" disabled>−</button><output id="lead-value" aria-live="polite">0%</output><button id="lead-up" aria-label="主唱增大 5%" title="主唱增大 5%" disabled>＋</button></div>
          <div class="pitch-control" role="group" aria-label="升降调"><button id="pitch-down" aria-label="降半音" title="降半音">♭</button><output id="pitch-value" aria-live="polite">原调</output><button id="pitch-up" aria-label="升半音" title="升半音">♯</button></div>
        </div>
      </div>
    </div>
  </footer>
  <dialog id="video-preview" class="video-preview" aria-labelledby="preview-title">
    <div class="preview-heading"><h2 id="preview-title"></h2><button id="close-preview" aria-label="关闭预览">×</button></div>
    <div id="preview-player" class="preview-player"></div>
    <div class="preview-actions"><a id="preview-source" target="_blank" rel="noopener noreferrer"></a><button id="preview-add" class="primary">点歌</button></div>
    <p id="preview-error" role="status" hidden></p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
